events {}

http{
    # Caddy terminates TLS and forwards the original scheme in
    # X-Forwarded-Proto. Passing $scheme here instead would overwrite that with
    # "http" -- this hop really is plain HTTP -- and the API would then build
    # http:// URLs, which breaks the OAuth callback. Fall back to $scheme only
    # when the header is absent, i.e. when nginx is reached without Caddy.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream backend {
        server api:5000;
    }

    server {
        listen 8080;
        include /etc/nginx/mime.types;

        # Serve the built Vue app. Vue Router uses history mode, so any path the
        # router owns must fall back to index.html rather than 404.
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Backend
        location /api/v1/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            rewrite ^/api/v1(/.*)$ $1 break;
        }

        location /admin {
            proxy_pass http://backend/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }
}
