# Runs the backend test suite on every push and pull request.
#
# The suite talks to SQLite in memory, so no database service is needed here --
# that is a property of the test fixtures, not an accident, and it is what keeps
# this workflow to a single job with no containers.
name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches docker/api/Dockerfile, so a green run here means the same
          # interpreter the container uses.
          python-version: '3.10.14'
          cache: pip
          cache-dependency-path: requirements/dev.txt

      # mysqlclient is a C extension and needs headers to build. The tests
      # themselves never touch MySQL, but it is in dev.txt, so pip builds it.
      - name: Install build dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: pip install -r ../requirements/dev.txt

      # controller/googleAuth/routes.py builds a GoogleAuthService at import
      # time, and that reads client_secret.json. The real file is a credential
      # and is deliberately not in the repository, so without a stand-in pytest
      # cannot even collect the suite -- it fails with FileNotFoundError before
      # any test runs.
      #
      # A placeholder is the pragmatic fix. The underlying problem is that the
      # application cannot be imported without a credential on disk; the real
      # fix is to build that service lazily.
      - name: Write a placeholder OAuth client secret
        run: |
          cat > service/client_secret.json <<'JSON'
          {
            "web": {
              "client_id": "ci-placeholder.apps.googleusercontent.com",
              "project_id": "ci-placeholder",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token",
              "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
              "client_secret": "ci-placeholder-not-a-real-secret",
              "redirect_uris": ["http://localhost/api/v1/sign-in/callback"]
            }
          }
          JSON

      - name: Run tests
        run: python -m pytest tests -q
